<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoCampus</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4faf7;display:grid;place-items:center;height:100vh;margin:0;color:#12372a}
    .box{background:#fff;padding:35px;border-radius:18px;box-shadow:0 15px 50px #0001;text-align:center}
  </style>
</head>
<body>
  <div class="box"><h2>Opening EcoCampus...</h2><p>Please wait.</p></div>
<script>
(async function(){
  const API_URL = window.ECOCAMPUS_API_URL || (
    window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
      ? "http://localhost:5000/api"
      : "https://ecocampus-api.onrender.com/api"
  );

  const token = localStorage.getItem("ecoCampusToken");
  if (!token) {
    location.replace("login.html");
    return;
  }
  try {
    const r = await fetch(`${API_URL}/auth/me`, {
      headers: { Authorization: "Bearer " + token }
    });
    if (!r.ok) throw new Error();
    const user = await r.json();
    localStorage.setItem("ecoCampusUser", JSON.stringify(user));
    location.replace(user.role === "admin" ? "admin.html" : "user.html");
  } catch {
    localStorage.removeItem("ecoCampusToken");
    localStorage.removeItem("ecoCampusUser");
    location.replace("login.html");
  }
})();
</script>
</body>
</html>
